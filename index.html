<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Discover Infinity Collections and connect with us on Instagram, Facebook and WhatsApp.">
  <title>Infinity Collections</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      color: #24201d;
      font-family: 'DM Sans', Arial, sans-serif;
      background-color: #544b43;
      background-image: linear-gradient(rgba(28, 24, 21, .28), rgba(28, 24, 21, .48)), url('bpic.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    main {
      width: min(100%, 560px);
      padding: clamp(32px, 6vw, 58px);
      text-align: center;
      background: rgba(250, 247, 240, .94);
      border: 1px solid rgba(255, 255, 255, .65);
      box-shadow: 0 20px 70px rgba(0, 0, 0, .23);
    }

    .eyebrow {
      margin: 0 0 14px;
      color: #7a5d49;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .24em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(42px, 8vw, 66px);
      font-weight: 500;
      line-height: 1.08;
      letter-spacing: -.045em;
    }

    .divider { width: 58px; height: 1px; margin: 28px auto; background: #a68b70; }
    .intro { margin: 0 auto 32px; max-width: 390px; color: #62584f; line-height: 1.7; }
    .links { display: grid; gap: 12px; }

    .links a {
      display: block;
      padding: 15px 20px;
      border: 1px solid #3d332b;
      color: #2b2520;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      transition: background .2s, color .2s, transform .2s;
    }

    .links a:hover, .links a:focus-visible {
      background: #2b2520;
      color: #fffaf2;
      transform: translateY(-2px);
    }

    .links a:focus-visible { outline: 3px solid #a2704a; outline-offset: 3px; }
    .signoff { margin: 32px 0 0; color: #655b52; font-size: 14px; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Welcome to</p>
    <h1>Infinity Collections</h1>
    <div class="divider" aria-hidden="true"></div>
    <p class="intro">Discover our collection and stay connected with us.</p>

    <nav class="links" aria-label="Connect with Infinity Collections">
      <a href="https://www.instagram.com/infinity___collections/" target="_blank" rel="noopener noreferrer">Instagram ↗</a>
      <a href="https://www.facebook.com/share/1FsqXxfGhy" target="_blank" rel="noopener noreferrer">Facebook ↗</a>
      <a href="https://chat.whatsapp.com/JOf0S4UiJKQ2xZkX1SD7q3?mode=ac_t" target="_blank" rel="noopener noreferrer">WhatsApp ↗</a>
    </nav>

    <p class="signoff">Looking forward to serving you!<br>— Infinity Collections Team</p>
  </main>
</body>
</html>
